[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_USE_NETLIFY_IMAGE_CDN = "true"

[images]
  remote_images = [
    "https://curupy\\.com/.*",
    "https://[a-z0-9]+\\.supabase\\.co/storage/v1/object/public/.*"
  ]

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
